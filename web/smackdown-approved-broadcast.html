<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmackDown · source-approved broadcast</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050913}iframe{display:block;border:0;width:100%;height:100%}</style>
<iframe id="broadcast" title="SmackDown broadcast" src="./preview-v4-42-smackdown-reference-qa.html?show=smackdown&broadcast=1"></iframe>
<script>
/* Overlay approved records only; the existing visual template and its files remain unchanged. */
const frame=document.getElementById('broadcast');
let approved=null;
async function load(){try{const r=await fetch('./data/smackdown-approved.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('no approved file');const j=await r.json();if(j.schema_version!==1||j.show_id!=='smackdown'||j.publication_scope!=='public_approved'||!Array.isArray(j.matches)||!Array.isArray(j.developments))throw Error('invalid');approved=j}catch(e){approved=null}}
function validRecord(x,kind){return x&&x.review_status==='approved'&&typeof x.source_url==='string'&&/^https:\/\//.test(x.source_url)&&typeof x.text==='string'&&x.text.trim().length>0&&x.text.length<=190&&/^202[0-9]-[01][0-9]-[0-3][0-9]$/.test(x.event_date||'')&&(kind!=='match'||x.event_date===approved.next_airdate)}
function addRows(d,id,rows,cls){const box=d.getElementById(id);if(!box||!rows.length)return false;box.replaceChildren();for(const x of rows.slice(0,3)){const row=d.createElement('div');row.className=cls;row.textContent=x.text;box.append(row)}return true}
function apply(){if(!approved)return;try{const d=frame.contentDocument;if(!d||!d.getElementById('board'))return;const type=d.getElementById('type')?.textContent||'';const afterBell=/RESULTS|AFTER THE BELL|POST-SHOW/i.test(type);const show=d.getElementById('show')?.textContent||'';if(!/smackdown/i.test(show))return;
if(afterBell){const results=(approved.results||[]).filter(x=>validRecord(x,'result')&&x.event_date===approved.previous_airdate);const developments=approved.developments.filter(x=>validRecord(x,'development')&&x.event_date===approved.previous_airdate);if(results.length){const box=d.getElementById('card');if(box){const signature=results.map(x=>x.text).join('|');if(box.dataset.approvedScroll!==signature){box.replaceChildren();box.dataset.approvedScroll=signature;box.style.overflowY='auto';box.style.scrollBehavior='auto';box.style.scrollbarWidth='none';for(const result of results){const row=d.createElement('div');row.className='reported-match';row.style.marginBottom='14px';const label=d.createElement('div');label.className='reported-stip';label.textContent=result.championship||'MATCH RESULT';const line=d.createElement('div');line.className='reported-text';line.textContent=result.text;row.append(label,line);box.append(row)}box.scrollTop=0}if(box.scrollHeight>box.clientHeight+3){const cycle=42000;const max=box.scrollHeight-box.clientHeight;const t=(Date.now()%cycle)/cycle;const eased=t<.1?0:t>.9?1:(t-.1)/.8;box.scrollTop=Math.round(max*eased)}}const title=d.getElementById('card-title');if(title)title.textContent='RESULTS & FALLOUT'}if(developments.length){addRows(d,'appearances',developments,'appearance-item');const panel=d.getElementById('appearance-panel');if(panel)panel.hidden=false;const label=d.getElementById('segment-title');if(label)label.textContent='STORYLINES & FALLOUT'}return}
const matches=approved.matches.filter(x=>validRecord(x,'match'));const ongoing=approved.developments.filter(x=>validRecord(x,'development')&&x.event_date<=approved.next_airdate);
if(matches.length)addRows(d,'card',matches,'reported-match');
if(ongoing.length){addRows(d,'appearances',ongoing.slice(-2),'appearance-item');const panel=d.getElementById('appearance-panel');if(panel)panel.hidden=false;const label=d.getElementById('segment-title');if(label)label.textContent='STORYLINE PROGRESSION'}
}catch(e){}}

load();setInterval(load,900000);setInterval(apply,1500);
</script></html>
