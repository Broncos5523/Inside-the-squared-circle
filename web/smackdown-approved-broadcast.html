<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmackDown · source-approved broadcast</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050913}iframe{display:block;border:0;width:100%;height:100%}</style>
<iframe id="broadcast" title="SmackDown broadcast" src="./preview-v4-42-smackdown-reference-qa.html?show=smackdown&broadcast=1"></iframe>
<script>
/* Overlay approved records only; the existing visual template and its files remain unchanged. */
const frame=document.getElementById('broadcast');
let approved=null;
async function load(){try{const r=await fetch('./data/smackdown-approved.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('no approved file');const j=await r.json();if(j.schema_version!==1||j.show_id!=='smackdown'||j.publication_scope!=='public_approved'||!Array.isArray(j.matches)||!Array.isArray(j.developments))throw Error('invalid');approved=j}catch(e){approved=null}}
function apply(){if(!approved)return;try{const d=frame.contentDocument;if(!d||!d.getElementById('board'))return;const current=d.getElementById('type')?.textContent||'';if(/RESULTS|AFTER THE BELL|POST-SHOW/i.test(current))return;const matches=approved.matches.filter(x=>x.review_status==='approved'&&x.source_url&&x.event_date===approved.next_airdate&&typeof x.text==='string');const developments=approved.developments.filter(x=>x.review_status==='approved'&&x.source_url&&typeof x.text==='string');if(matches.length){const card=d.getElementById('card');if(card){card.replaceChildren();for(const x of matches.slice(0,3)){const row=d.createElement('div');row.className='reported-match';row.textContent=x.text;card.append(row)}}}if(developments.length){const area=d.getElementById('appearances');if(area){area.replaceChildren();for(const x of developments.slice(0,2)){const row=d.createElement('div');row.className='appearance-item';row.textContent=x.text;area.append(row)}const panel=d.getElementById('appearance-panel');if(panel)panel.hidden=false;const label=d.getElementById('segment-title');if(label)label.textContent='STORYLINE PROGRESSION'}}}catch(e){}}
load();setInterval(load,900000);setInterval(apply,1500);
</script></html>
