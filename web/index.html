<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside the Squared Circle</title>
<style>html,body{margin:0;min-height:100%;background:#000;color:#eee;font-family:Arial,sans-serif}main{padding:2rem}a{color:#e4bd59}</style>
</head>
<body><main><p>Opening Inside the Squared Circle…</p><a href="staging/?view=tv&amp;mode=active">Open the live display</a></main>
<script>
(function(){
 var target=new URL('staging/',location.href);
 target.searchParams.set('view','tv');target.searchParams.set('mode','active');
 var id=new URLSearchParams(location.search).get('id');
 if(id&&/^[a-z0-9_-]+$/.test(id))target.searchParams.set('id',id);
 location.replace(target.href);
})();
</script></body></html>
