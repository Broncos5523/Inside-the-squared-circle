<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmackDown · Broadcast integration review</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#050913;color:#fff;font-family:Arial}body{display:grid;place-items:center}main{width:min(100vw,56.25dvh);height:min(100dvh,177.778vw);position:relative;overflow:hidden}iframe{width:100%;height:100%;border:0}#panel{position:absolute;bottom:0;left:0;right:0;z-index:3;background:#071529f2;border-top:2px solid #68b8ff;padding:10px 12px;font-size:clamp(10px,2.1vw,15px);box-shadow:0 -8px 28px #000b}#panel strong{color:#a9d8ff}#panel p{margin:4px 0;line-height:1.25}#panel small{color:#a8b9d2}#panel button{float:right;background:#153967;border:1px solid #7bc4ff;border-radius:5px;color:white;padding:4px 9px;cursor:pointer}</style>
<main><iframe title="Existing SmackDown v4.42 broadcast review" src="./preview-v4-42-smackdown-reference-qa.html"></iframe>
<div id="panel"><button id="toggle" type="button">Hide audit</button><strong>SMACKDOWN · DATA INTEGRATION AUDIT</strong><div id="details"><p id="schedule">Checking schedule…</p><p id="matches">Checking match data…</p><p id="results">Checking results…</p><p id="storylines">Checking storylines…</p><small>Existing v4.42 graphics are unchanged. No unreviewed claims displayed. This audit is not the approved final board.</small></div></div></main>
<script>
const el=id=>document.getElementById(id);
el('toggle').onclick=()=>{let d=el('details'),hide=d.hidden;d.hidden=!hide;el('toggle').textContent=hide?'Hide audit':'Show audit'};
const get=async name=>{let r=await fetch('./data/'+name+'.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(name);return r.json()};
const show=j=>j?.programs?.find(x=>x.show_id==='smackdown');
const verified=a=>Array.isArray(a)?a.filter(x=>x&&x.review_status==='approved'&&typeof x.display_text==='string').length:0;
async function refresh(){try{let [s,c,r,f]=await Promise.all(['snapshot','reported','results','rss-fallout'].map(get));let ep=s.shows?.find(x=>x.id==='smackdown')?.next;el('schedule').textContent='Next broadcast: '+(ep?.date||'not available');el('matches').textContent='Approved upcoming matches in feed: '+verified(show(c)?.matches);el('results').textContent='Approved results in feed: '+verified(show(r)?.results);el('storylines').textContent='Approved storyline developments in feed: '+verified(show(f)?.developments)}catch(e){el('schedule').textContent='Data fetch failed: '+e.message;for(let id of ['matches','results','storylines'])el(id).textContent='Waiting for source data'}}refresh();setInterval(refresh,900000);
</script></html>
