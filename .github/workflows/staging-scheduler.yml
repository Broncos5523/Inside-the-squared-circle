name: Refresh isolated wrestling staging data
on:
  workflow_dispatch:
  schedule:
    - cron: '41 */4 * * *'
permissions:
  contents: write
concurrency:
  group: inside-circle-staging-refresh
  cancel-in-progress: false
jobs:
  refresh-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out isolated staging branch
        uses: actions/checkout@v4
        with:
          ref: work/all-boards-github-pages
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging source and playlist tests
        run: |
          node --check proof/staging/collect.mjs
          node --check proof/staging/official-events.mjs
          node --check proof/staging/reviewed-archive-fallback.mjs
          node --check proof/staging/reviewed-archive-fallback.mjs
          node --check web/staging/board-adapter.js
          node --check web/staging/playlist-engine.js
          node --check web/staging/review.js
          node --test tests/staging-playlist.cjs tests/staging-official-events.mjs tests/staging-reviewed-archive.mjs
      - name: Collect only source-gated staging facts
        run: node proof/staging/collect.mjs
      - name: Commit only staging programming data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/staging/data/programming.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(staging): scheduled source-gated programming refresh'
            git push origin HEAD:work/all-boards-github-pages
          fi
