name: Validate staging live-data pipeline
on:
  push:
    branches:
      - work/all-boards-github-pages
    paths:
      - 'proof/staging/**'
      - 'web/staging/**'
      - 'tests/staging-playlist.cjs'
      - 'tests/staging-official-events.mjs'
      - 'tests/staging-reviewed-archive.mjs'
      - '.github/workflows/staging-live-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check proof/staging/collect.mjs
          node --check proof/staging/official-events.mjs
          node --check proof/staging/reviewed-archive-fallback.mjs
          node --check web/staging/board-adapter.js
          node --check web/staging/playlist-engine.js
          node --check web/staging/review.js
      - name: Run staging playlist tests
        run: node --test tests/staging-playlist.cjs tests/staging-official-events.mjs tests/staging-reviewed-archive.mjs
      - name: Collect staging facts (scheduled runs only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node proof/staging/collect.mjs
      - name: Commit fresh staging facts without publishing production
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/staging/data/programming.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(staging): refresh source-gated wrestling programming'
            git push origin HEAD:work/all-boards-github-pages
          fi
