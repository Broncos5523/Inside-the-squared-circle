name: Diagnostic - V5 live WCN parser (read-only)
# Temporary diagnostic branch only; no pushes to main and no data publication.
on:
  push:
    branches: [diag/wcn-probe]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-wcn-readonly-probe
  cancel-in-progress: false
jobs:
  v5-parser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
      - name: Run live V5 collector test (counts, HTTP status and dates only)
        run: node diagnostics/run_v5_live.mjs
