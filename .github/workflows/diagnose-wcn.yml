name: Diagnostic - probe real WCN sources (read-only)
# Runs ONLY when the throwaway branch diag/wcn-probe is pushed (or run manually).
# Never runs on main, never commits, never deploys, never uploads artifacts.
on:
  push:
    branches: [diag/wcn-probe]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wcn-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe real WCN feed and event pages (counts and URL paths only, no WCN text)
        run: |
          python - <<'PY'
          """DIAGNOSTIC ONLY: probe the real Wrestling Central News sources from GitHub's network.

          Prints HTTP status codes, byte counts, structural counts and URL paths ONLY.
          It never prints, saves or uploads any WCN article text (run logs of a public
          repository are public). Reads at most ~10 pages once, 2 seconds apart.
          Always exits 0 so the logs are readable even when a source fails.
          """
          import json
          import re
          import time
          from datetime import datetime
          from email.utils import parsedate_to_datetime
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET
          from zoneinfo import ZoneInfo

          from proof import wcn_private_cards as wcn

          # Identical headers to the production collector so we test the same request.
          HEADERS = {"User-Agent": "InsideSquaredCirclePersonalHomeBoard/1.0 (4-hour refresh)",
                     "Accept": "application/rss+xml,text/xml,text/html"}
          NY = ZoneInfo("America/New_York")
          VS = re.compile(r"\bvs\.?(?=\s)|\bversus\b|\bfaces?\b|\btakes? on\b|\bchallenges?\b", re.I)
          KNOWN = {"card & preview", "results", "more news from this show", "match card",
                   "details", "venue", "where to watch", "how to watch"}
          EVENT_PATH = re.compile(r"^/events/\d{4}-\d{2}-\d{2}-[a-z0-9-]{3,60}/?$")
          HREF = re.compile(rb"""href=["']((?:https?://(?:www\.)?wrestlingcentralnews\.com)?/events/[^"'#?\s]+)""", re.I)
          SHOWS = {"raw": "wwe-raw", "smackdown": "wwe-smackdown", "nxt": "wwe-nxt", "tna": "tna-impact"}


          def emit(kind, **fields):
              print("PROBE|" + kind + "|" + json.dumps(fields, sort_keys=True, ensure_ascii=True), flush=True)


          def get(url):
              """Never raises. Returns status, final path, content type, raw bytes, error name."""
              t0 = time.time()
              try:
                  with urlopen(Request(url, headers=HEADERS), timeout=20) as r:
                      raw = r.read(2_000_001)[:2_000_000]
                      return {"status": r.status, "final_path": urlsplit(r.geturl()).path,
                              "ctype": (r.headers.get("Content-Type") or "").split(";")[0],
                              "raw": raw, "error": None, "secs": round(time.time() - t0, 2)}
              except HTTPError as exc:
                  return {"status": exc.code, "final_path": urlsplit(url).path, "ctype": "",
                          "raw": b"", "error": "HTTPError", "secs": round(time.time() - t0, 2)}
              except Exception as exc:  # network, TLS, timeout, DNS
                  return {"status": None, "final_path": "", "ctype": "", "raw": b"",
                          "error": type(exc).__name__, "secs": round(time.time() - t0, 2)}


          class Outline(HTMLParser):
              """Counts structure per section. Stores no text; only lengths and hit counts."""

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.section = "(before first h2)"
                  self.capture = None
                  self.buf = []
                  self.sections = {}
                  self.headings = {}
                  self.tags = {}
                  self.skip = 0  # depth inside <script>/<style>: their contents are not visible text

              def _slot(self):
                  return self.sections.setdefault(self.section, {"p": 0, "li": 0, "tr": 0, "chars": 0, "vs_hits": 0})

              def handle_starttag(self, tag, attrs):
                  self.tags[tag] = self.tags.get(tag, 0) + 1
                  if tag in ("script", "style"):
                      self.skip += 1
                  elif tag in ("h2", "h3"):
                      self.capture, self.buf = tag, []
                  elif tag in ("p", "li", "tr"):
                      self._slot()[tag] += 1

              def handle_data(self, data):
                  if self.skip:
                      return
                  if self.capture:
                      self.buf.append(data)
                  else:
                      slot = self._slot()
                      slot["chars"] += len(data.strip())
                      slot["vs_hits"] += len(VS.findall(data))

              def handle_endtag(self, tag):
                  if tag in ("script", "style"):
                      self.skip = max(0, self.skip - 1)
                  if tag == self.capture:
                      text = " ".join("".join(self.buf).split()).lower()
                      label = text if text in KNOWN else "other"  # unknown heading text is never printed
                      key = tag + ":" + label
                      self.headings[key] = self.headings.get(key, 0) + 1
                      if tag == "h2":
                          self.section = label
                      self.capture = None


          def outline(raw):
              out = Outline()
              out.feed(raw.decode("utf-8", "replace"))
              body_chars = sum(s["chars"] for s in out.sections.values())
              return out, {
                  "bytes": len(raw),
                  "visible_text_chars": body_chars,
                  "script_tags": out.tags.get("script", 0),
                  "headings": out.headings,
                  "sections": out.sections,
                  "js_markers": {"next_data": b"__NEXT_DATA__" in raw, "nuxt": b"__NUXT__" in raw,
                                 "ld_json": raw.count(b"application/ld+json"),
                                 "root_div": bool(re.search(rb'id=["\'](?:root|app|__next)["\']', raw))},
                  "looks_js_rendered": len(raw) > 5000 and body_chars < 400,
              }


          def analyse_feed(raw):
              info = {"bytes": len(raw)}
              try:
                  root = ET.fromstring(raw)
              except Exception as exc:
                  info["parse_error"] = type(exc).__name__
                  return info
              items = root.findall("./channel/item")
              sections, dated, desc_lens = {}, [], []
              titles_vs = 0
              mention = {k: 0 for k in SHOWS}
              patterns = {"raw": r"\braw\b", "smackdown": r"smack\s?down", "nxt": r"\bnxt\b", "tna": r"\btna\b|impact"}
              for item in items:
                  link = (item.findtext("link") or "").strip()
                  seg = "/" + (urlsplit(link).path.strip("/").split("/")[0] if link else "")
                  sections[seg] = sections.get(seg, 0) + 1
                  title = item.findtext("title") or ""
                  titles_vs += bool(re.search(r"\bvs\.?(?=\s)|\bversus\b", title, re.I))
                  for key, pat in patterns.items():
                      mention[key] += bool(re.search(pat, title, re.I))
                  desc = (item.findtext("description") or "").strip()
                  if desc:
                      desc_lens.append(len(desc))
                  try:
                      dated.append(parsedate_to_datetime(item.findtext("pubDate") or "").astimezone(NY))
                  except Exception:
                      pass
              info.update({
                  "root_tag": root.tag, "items": len(items), "link_sections": sections,
                  "titles_with_vs": titles_vs, "titles_mentioning_show": mention,
                  "items_with_description": len(desc_lens),
                  "description_len_median": sorted(desc_lens)[len(desc_lens) // 2] if desc_lens else 0,
                  "newest_item": max(dated).isoformat() if dated else None,
                  "oldest_item": min(dated).isoformat() if dated else None})
              return info


          def verdict(status, info, sections, parsed):
              if status != 200:
                  return "HTTP_%s" % status
              if not sections.get("card & preview"):
                  return "NO_CARD_SECTION_IN_RAW_HTML" + ("_PAGE_LOOKS_JS_RENDERED" if info["looks_js_rendered"] else "")
              if parsed["matches"] or parsed["appearances"]:
                  return "PARSER_FOUND_DATA"
              if sections["card & preview"]["vs_hits"] > 0:
                  return "CARD_SECTION_HAS_MATCH_LANGUAGE_BUT_PARSER_FOUND_0"
              return "CARD_SECTION_PRESENT_BUT_NO_MATCH_LANGUAGE"


          def probe_page(label, show, url, getter, sleep):
              time.sleep(sleep)
              res = getter(url)
              path = urlsplit(url).path
              base = {"label": label, "show": show, "path": path, "status": res["status"],
                      "error": res["error"], "final_path": res["final_path"], "secs": res["secs"],
                      "ctype": res["ctype"]}
              if res["status"] != 200:
                  emit("page", verdict=verdict(res["status"], None, {}, None), **base)
                  return verdict(res["status"], None, {}, None)
              out, info = outline(res["raw"])
              parsed = wcn.parse_page(res["raw"])
              v = verdict(200, info, out.sections, parsed)
              emit("page", verdict=v, parser_matches=len(parsed["matches"]),
                   parser_appearances=len(parsed["appearances"]), **base, **info)
              return v


          def main(getter=get, snapshot_path="web/data/snapshot.json", sleep=2):
              now = datetime.now(NY)
              emit("run", started_et=now.isoformat(), note="counts and URL paths only; no WCN text")
              snapshot = json.loads(Path(snapshot_path).read_text(encoding="utf-8"))
              airdate = {s["id"]: (s.get("next") or {}).get("date") for s in snapshot["shows"]}

              feed = getter(wcn.FEED)
              fields = {"status": feed["status"], "error": feed["error"], "secs": feed["secs"], "ctype": feed["ctype"]}
              if feed["status"] == 200:
                  fields.update(analyse_feed(feed["raw"]))
              emit("feed", **fields)

              time.sleep(sleep)
              up = getter(wcn.BASE + "/upcoming/")
              listed = []
              up_fields = {"status": up["status"], "error": up["error"], "secs": up["secs"]}
              if up["status"] == 200:
                  for match in HREF.findall(up["raw"]):
                      path = urlsplit(match.decode("ascii", "ignore")).path
                      if EVENT_PATH.match(path) and path not in listed:
                          listed.append(path)
                  _, info = outline(up["raw"])
                  up_fields.update({"bytes": info["bytes"], "looks_js_rendered": info["looks_js_rendered"],
                                    "event_links_found": len(listed), "event_paths": sorted(listed)[:25]})
              emit("upcoming", **up_fields)

              verdicts = {}
              for show, slug in SHOWS.items():
                  air = airdate.get(show)
                  if not air:
                      verdicts[show] = "NO_AIRDATE_IN_SNAPSHOT"
                      continue
                  path = "/events/%s-%s/" % (air, slug)
                  on_list = (path in listed) if up["status"] == 200 and listed else None
                  emit("collector_url", show=show, path=path, listed_on_upcoming=on_list)
                  verdicts[show] = probe_page("collector_url", show, wcn.BASE + path, getter, sleep)
                  # If WCN lists a different page for this show, test that one too (max one).
                  words = {"raw": "raw", "smackdown": "smackdown", "nxt": "nxt", "tna": "impact"}[show]
                  alts = [p for p in sorted(listed) if words in p and p != path and p[8:18] >= now.date().isoformat()]
                  if alts:
                      verdicts[show + "_alt"] = probe_page("listed_alternative", show, wcn.BASE + alts[0], getter, sleep)

              for key, value in verdicts.items():
                  emit("summary", target=key, verdict=value)
              emit("done", ok=True)


          if __name__ == "__main__":
              try:
                  main()
              except Exception as exc:  # a diagnostic must never hide its own failure
                  emit("crash", error=type(exc).__name__, detail=str(exc)[:120])
          PY
