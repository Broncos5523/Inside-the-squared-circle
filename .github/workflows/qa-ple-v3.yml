name: QA standalone WrestleMania broadcast preview
on:
  push:
    paths: ['.github/workflows/qa-ple-v3.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Capture actual 720x1280 screen and assert both locally hosted images load
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/review
          python -m http.server 8765 --directory web >/tmp/wm-preview-http.log 2>&1 &
          python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  page=await browser.new_page(viewport={'width':720,'height':1280},device_scale_factor=1)
                  response=await page.goto('http://127.0.0.1:8765/preview-ple-wrestlemania-v3-broadcast.html',wait_until='networkidle',timeout=60000)
                  await page.screenshot(path='web/review/wrestlemania-v3-720x1280.png',full_page=False)
                  images=await page.locator('img').evaluate_all('(els)=>els.map(e=>({src:e.getAttribute("src"),ok:e.complete && e.naturalWidth>0,naturalWidth:e.naturalWidth,naturalHeight:e.naturalHeight}))')
                  dimensions=await page.locator('#board').bounding_box()
                  heading=await page.locator('.nameplate').inner_text()
                  report={'http_status':response.status if response else None,'images':images,'board':dimensions,'heading':heading,'qa_resolution':'720x1280'}
                  Path('web/review/wrestlemania-v3-qa.json').write_text(json.dumps(report,indent=2))
                  print(json.dumps(report,indent=2))
                  assert response and response.status==200
                  assert all(i['ok'] for i in images),'A local reference image failed to load'
                  assert dimensions and round(dimensions['width'])==720 and round(dimensions['height'])==1280
                  await browser.close()
          asyncio.run(main())
          PY
      - name: Commit screenshot and visual smoke test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/review/wrestlemania-v3-720x1280.png web/review/wrestlemania-v3-qa.json
          if ! git diff --cached --quiet; then
            git commit -m 'test(ple): record 720x1280 V3 visual and locally hosted asset QA'
            git pull --rebase origin main
            git push origin HEAD:main
          fi