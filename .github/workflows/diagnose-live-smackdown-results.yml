name: Diagnostic - live WWE SmackDown results extraction
on:
  push:
    branches: [diag/wcn-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-results:
    runs-on: ubuntu-latest
    steps:
      - name: Count WWE result text nodes
        shell: python
        run: |
          import json, urllib.request
          from html.parser import HTMLParser
          class Reader(HTMLParser):
            def __init__(self):
              super().__init__()
              self.parts=[]
            def handle_data(self, value):
              value=" ".join(value.split())
              if value:
                self.parts.append(value)
          url="https://www.wwe.com/shows/smackdown/2026-10-23/results"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=20) as response:
            page=response.read().decode("utf-8","replace")
          reader=Reader()
          reader.feed(page)
          matches=[x for x in reader.parts if " def. " in x.lower()]
          print("LIVE_WWE_COUNTS "+json.dumps({"matches":len(matches),"lengths":[len(x) for x in matches],"source":"WWE SmackDown 2026-10-23"}))
