name: Validate production handoff
on:
  push:
    branches: [work/production-handoff-20261031]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all recovered sources and artwork
        run: node proof/staging/verify.mjs
      - name: Test playback, data rules, and production packaging
        run: node --test tests/staging*.cjs tests/staging*.mjs tests/production*.mjs
      - name: Check existing research and display tests
        run: python -m unittest discover -s tests
