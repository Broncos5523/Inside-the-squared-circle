          cp web/data/evolve-synopsis.json /tmp/itsc-new-evolve-synopsis.json
          cp web/data/recap-links.json /tmp/itsc-new-recap-links.json
          cp web/data/rss-facts.json /tmp/itsc-new-rss-facts.json
          cp web/data/episode-briefs.json /tmp/itsc-new-episode-briefs.json
