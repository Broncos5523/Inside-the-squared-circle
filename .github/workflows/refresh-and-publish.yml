name: Refresh schedules and publish display
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: squared-circle-pages
  cancel-in-progress: true
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect permitted TVmaze schedule data
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          import time
          from pathlib import Path
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError

          path=Path('web/data/snapshot.json')
          try:
              old=json.loads(path.read_text())
          except (ValueError,FileNotFoundError):
              old={}
          prior={s.get('id'):s for s in old.get('shows',[]) if isinstance(s,dict)}
          specs=[
              ('raw','MONDAY NIGHT RAW',802,'#EC354C','primary'),
              ('smackdown','FRIDAY NIGHT SMACKDOWN',803,'#2385FF','primary'),
              ('nxt','WWE NXT',2266,'#E5BD50','primary'),
              ('aaa','LUCHA LIBRE AAA',89983,'#21C6AE','primary'),
              ('tna','TNA iMPACT!',1349,'#FC493F','primary'),
              ('evolve','LAST WEEK ON EVOLVE',82403,'#BA80F7','recap')]
          today=dt.datetime.now(dt.timezone.utc).date()
          fresh=0
          output=[]
          def episode(x):
              if not isinstance(x,dict): return None
              date=x.get('airdate')
              try: dt.date.fromisoformat(date)
              except (TypeError,ValueError): return None
              time_value=x.get('airtime')
              if not isinstance(time_value,str) or not re.fullmatch(r'(?:[01][0-9]|2[0-3]):[0-5][0-9]',time_value):
                  time_value=None
              return {'date':date,'time':time_value,'title':str(x.get('name') or 'Episode')[:100]}
          for slug,name,id,color,category in specs:
              record={'id':slug,'name':name,'color':color,'category':category,
                      'next':None,'previous':None,'schedule_status':'unavailable',
                      'confirmed_matches':[],'confirmed_appearances':[]}
              url=f'https://api.tvmaze.com/shows/{id}?embed%5B%5D=nextepisode&embed%5B%5D=previousepisode'
              try:
                  request=Request(url,headers={'User-Agent':'InsideSquaredCircleHouseholdDemo/0.1','Accept':'application/json'})
                  with urlopen(request,timeout=18) as response:
                      data=json.load(response)
                  if data.get('id') != id: raise ValueError('TVmaze show ID mismatch')
                  embed=data.get('_embedded') or {}
                  record['next']=episode(embed.get('nextepisode'))
                  record['previous']=episode(embed.get('previousepisode'))
                  if record['next'] and record['next']['date'] < today.isoformat():
                      record['next']=None
                  record['schedule_status']='fresh'
                  fresh+=1
              except Exception as error:
                  print(f'{slug}: source delayed: {type(error).__name__}: {str(error)[:90]}')
                  previous=prior.get(slug)
                  if previous:
                      record['next']=previous.get('next')
                      record['previous']=previous.get('previous')
                      if record['next'] and record['next'].get('date','') < today.isoformat():
                          record['next']=None
                      record['schedule_status']='stale'
              output.append(record)
          snap={'schema_version':1,
                'mode':'LIVE_SCHEDULES_ONLY' if fresh else 'STALE_SCHEDULES_ONLY',
                'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),
                'fresh_shows':fresh,
                'shows':output}
          assert len(snap['shows'])==6
          assert all(not s['confirmed_matches'] and not s['confirmed_appearances'] for s in output)
          path.parent.mkdir(parents=True,exist_ok=True)
          temp=path.with_suffix('.tmp')
          temp.write_text(json.dumps(snap,ensure_ascii=False,indent=2)+'\n')
          temp.replace(path)
          print('Live schedule responses:',fresh,'of',len(specs))
          PY
      - name: Test research intake safeguards
        run: python -m unittest discover -s tests -v
      - name: Collect unverified match-card research leads
        run: python proof/card_intake.py --snapshot web/data/snapshot.json --out web/data/candidates.json
      - name: Build opt-in reported match descriptions (never confirmed)
        run: python -m proof.reported_cards --snapshot web/data/snapshot.json --out web/data/reported.json
      - name: Check unverified labeling and source references
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          report=json.loads(Path('web/data/reported.json').read_text())
          assert report['mode']=='REPORTED_MATCHES_UNVERIFIED'
          assert len(report['programs'])==6
          for item in report['programs']:
              assert item['display_label']=='REPORTED · UNVERIFIED'
              if item['show_id'] in ('aaa','evolve'):
                  assert not item['matches']
              for appearance in item.get('appearances', []):
                  assert appearance['status']=='REPORTED_UNVERIFIED'
                  assert re.fullmatch(r'https://www.thesportsdb.com/api/v1/json/123/lookupevent.php\?id=\d+',appearance['evidence_url'])
              for match in item['matches']:
                  assert match['status']=='REPORTED_UNVERIFIED'
                  assert re.fullmatch(r'https://www.thesportsdb.com/api/v1/json/123/lookupevent.php\?id=\d+',match['evidence_url'])
          print('PASS: no candidate presented as official confirmation')
          PY
      - name: Audit zero-confirmed-match guarantee
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('web/data/candidates.json').read_text())
          assert report['mode']=='RESEARCH_LEADS_ONLY'
          assert len(report['programs']) == 6
          assert not report['verified_matches'] and not report['verified_appearances']
          assert all(p['verified_match_count']==0 and p['verified_appearance_count']==0 for p in report['programs'])
          print('AUDIT PASS: research mentions are never treated as verified')
          PY
      - name: Save last-known schedule cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp web/data/snapshot.json /tmp/itsc-new-snapshot.json
          cp web/data/candidates.json /tmp/itsc-new-candidates.json
          cp web/data/reported.json /tmp/itsc-new-reported.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/itsc-new-snapshot.json web/data/snapshot.json
            cp /tmp/itsc-new-candidates.json web/data/candidates.json
            cp /tmp/itsc-new-reported.json web/data/reported.json
            git add web/data/snapshot.json web/data/candidates.json web/data/reported.json
            if git diff --cached --quiet; then
              echo "No schedule changes to commit"
              break
            fi
            git commit -m "chore: update automated wrestling schedules"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to publish schedule after 3 attempts" >&2
              exit 1
            fi
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static display
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish static display
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Smoke-test public v4.6 previews and deployed reported feed
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = 'https://broncos5523.github.io/Inside-the-squared-circle'
          nonce = os.environ.get('GITHUB_RUN_ID', 'check')
          expected = json.loads(Path('web/data/reported.json').read_text(encoding='utf-8'))
          checks = [
              (f'{base}/preview-v4-6.html?show=smackdown&probe={nonce}', 'smackdown'),
              (f'{base}/preview-v4-6.html?show=tna&probe={nonce}', 'tna'),
              (f'{base}/data/reported.json?probe={nonce}', 'reported'),
          ]
          for attempt in range(15):
              try:
                  for url, kind in checks:
                      request = Request(url, headers={
                          'User-Agent': 'InsideSquaredCircleSmokeTest/0.1',
                          'Cache-Control': 'no-cache',
                      })
                      with urlopen(request, timeout=18) as response:
                          assert response.status == 200
                          body = response.read()
                      if kind == 'reported':
                          published = json.loads(body)
                          assert published['mode'] == 'REPORTED_MATCHES_UNVERIFIED'
                          assert published['generated_at'] == expected['generated_at']
                          assert len(published['programs']) == 6
                      else:
                          assert b'DISPLAY BUILD 4.6' in body
                          assert b'const perPage=2' in body
                          assert b'REPORTED / UNVERIFIED' in body
                  print('PUBLIC PAGE SMOKE PASS: v4.6 direct review links + matching reported.json')
                  break
              except Exception as exc:
                  if attempt == 14:
                      raise RuntimeError('Public Pages post-deploy smoke test failed') from exc
                  print(f'Awaiting Pages CDN update: {type(exc).__name__}: {str(exc)[:120]}')
                  time.sleep(7)
          PY
