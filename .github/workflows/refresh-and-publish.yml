          cp web/data/rss-fallout.json /tmp/itsc-new-rss-fallout.json
          cp web/data/coverage-health.json /tmp/itsc-new-coverage-health.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/itsc-new-snapshot.json web/data/snapshot.json
            cp /tmp/itsc-new-candidates.json web/data/candidates.json
            cp /tmp/itsc-new-reported.json web/data/reported.json
            cp /tmp/itsc-new-known-events.json web/data/known-events.json
            cp /tmp/itsc-new-tvmaze.json web/data/tvmaze-reported.json
            cp /tmp/itsc-new-results.json web/data/results.json
            cp /tmp/itsc-new-evolve-synopsis.json web/data/evolve-synopsis.json
            cp /tmp/itsc-new-recap-links.json web/data/recap-links.json
            cp /tmp/itsc-new-rss-facts.json web/data/rss-facts.json
            cp /tmp/itsc-new-episode-briefs.json web/data/episode-briefs.json
            cp /tmp/itsc-new-rss-excerpt-results.json web/data/rss-excerpt-results.json
            cp /tmp/itsc-new-rss-fallout.json web/data/rss-fallout.json
            cp /tmp/itsc-new-coverage-health.json web/data/coverage-health.json
            git add web/data/snapshot.json web/data/candidates.json web/data/reported.json web/data/tvmaze-reported.json web/data/known-events.json web/data/results.json web/data/evolve-synopsis.json web/data/recap-links.json web/data/rss-facts.json web/data/episode-briefs.json web/data/rss-excerpt-results.json web/data/rss-fallout.json web/data/coverage-health.json
            if git diff --cached --quiet; then
              echo "No schedule changes to commit"
              break
            fi
            git commit -m "chore: update automated wrestling schedules"
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to publish schedule after 3 attempts" >&2
              exit 1
            fi
          done
